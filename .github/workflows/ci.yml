name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned commit of https://github.com/nst/JSONTestSuite
  JSON_TEST_SUITE_REF: 1ef36fa01286573e846ac449e8683f8833c5b26a

jobs:
  windows-msvc:
    name: ${{ matrix.name }} (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: MSVC x64, preset: msvc-x64, config: Release, run: true, conformance: true, artifact: true }
          - { name: MSVC x64, preset: msvc-x64, config: Debug, run: true }
          - { name: MSVC x86, preset: msvc-x86, config: Release, run: true }
          - { name: clang-cl x64, preset: clang-cl-x64, config: Release, run: true, conformance: true }
          # Cross-compiled on an x64 runner: build only, the tests cannot run there.
          - { name: MSVC ARM64, preset: msvc-arm64, config: Release, run: false, artifact: true }
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config }} --parallel

      - name: Test
        if: matrix.run
        run: ctest --test-dir build/${{ matrix.preset }} -C ${{ matrix.config }} --output-on-failure

      - name: Checkout JSONTestSuite
        if: matrix.conformance
        uses: actions/checkout@v6
        with:
          repository: nst/JSONTestSuite
          ref: ${{ env.JSON_TEST_SUITE_REF }}
          path: JSONTestSuite

      - name: Conformance (JSONTestSuite)
        if: matrix.conformance
        run: python scripts/run_jsontestsuite.py build/${{ matrix.preset }}/${{ matrix.config }}/wjson.exe JSONTestSuite/test_parsing

      - name: Upload wjson.exe
        if: matrix.artifact
        uses: actions/upload-artifact@v6
        with:
          name: wjson-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/${{ matrix.config }}/wjson.exe
          if-no-files-found: error

  windows-mingw:
    name: MinGW-w64 (UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: cmake -S . -B build/mingw -G Ninja -DCMAKE_BUILD_TYPE=Release -DWJSON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/mingw --parallel

      - name: Test
        run: ctest --test-dir build/mingw --output-on-failure

      - name: Checkout JSONTestSuite
        uses: actions/checkout@v6
        with:
          repository: nst/JSONTestSuite
          ref: ${{ env.JSON_TEST_SUITE_REF }}
          path: JSONTestSuite

      - name: Conformance (JSONTestSuite)
        run: python scripts/run_jsontestsuite.py build/mingw/wjson.exe JSONTestSuite/test_parsing

  package:
    # Installs the library and builds a separate project with find_package().
    name: CMake package (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and install
        run: |
          cmake --preset msvc-x64 -DWJSON_BUILD_TESTS=OFF
          cmake --build build/msvc-x64 --config Release --parallel
          cmake --install build/msvc-x64 --config Release --prefix ${{ github.workspace }}/install

      - name: Build consumer project
        run: |
          cmake -S tests/package -B build/package -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build build/package --config Release
          ctest --test-dir build/package -C Release --output-on-failure

  vcpkg:
    # Builds the overlay port in ports/wjson with the runner's vcpkg.
    name: vcpkg port (${{ matrix.triplet }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        triplet: [x64-windows, x64-windows-static]
    steps:
      - uses: actions/checkout@v6

      - name: Install port
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "wjson[tool]:${{ matrix.triplet }}" --overlay-ports=ports
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/buildtrees/wjson" -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { "::group::$($_.Name)"; Get-Content $_.FullName; "::endgroup::" }
            exit 1
          }

      - name: Build consumer project
        shell: pwsh
        run: |
          cmake -S tests/package -B build/vcpkg-consumer `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build/vcpkg-consumer --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build/vcpkg-consumer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run installed tool
        shell: pwsh
        run: |
          $tool = "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.triplet }}/tools/wjson/wjson.exe"
          & $tool --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  benchmark:
    # Publishes throughput figures in the run summary. Shared CI machines are
    # noisy, so compare trends rather than single numbers.
    name: Benchmark (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset msvc-x64 -DWJSON_BUILD_BENCHMARKS=ON -DWJSON_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/msvc-x64 --config Release --target wjson_bench --parallel

      - name: Fetch benchmark data
        run: python scripts/fetch_benchmark_data.py bench-data

      - name: Run benchmark
        shell: pwsh
        run: |
          $table = & build/msvc-x64/Release/wjson_bench.exe --markdown --min-time 2 bench-data/twitter.json bench-data/canada.json bench-data/citm_catalog.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $table | Write-Output
          "## wjson benchmark (MSVC x64, windows-latest)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $table | Out-File -Append $env:GITHUB_STEP_SUMMARY

  linux:
    # Portability check and sanitizers (ASan/UBSan are not yet wired up for MSVC).
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC, preset: linux-gcc }
          - { name: Clang + ASan/UBSan, preset: linux-clang-sanitize }
    steps:
      - uses: actions/checkout@v6

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Checkout JSONTestSuite
        uses: actions/checkout@v6
        with:
          repository: nst/JSONTestSuite
          ref: ${{ env.JSON_TEST_SUITE_REF }}
          path: JSONTestSuite

      - name: Conformance (JSONTestSuite)
        run: python3 scripts/run_jsontestsuite.py build/${{ matrix.preset }}/wjson JSONTestSuite/test_parsing
